<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>signCollect - Login</title>
    <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-logo i {
            font-size: 48px;
            color: #0f3460;
            margin-bottom: 12px;
        }
        .login-logo h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a2e;
            margin: 8px 0 4px;
        }
        .login-logo p {
            color: #6c757d;
            font-size: 14px;
            margin: 0;
        }
        .form-floating {
            margin-bottom: 16px;
        }
        .form-floating .form-control {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            height: 56px;
            font-size: 15px;
            transition: border-color 0.2s;
        }
        .form-floating .form-control:focus {
            border-color: #0f3460;
            box-shadow: 0 0 0 3px rgba(15, 52, 96, 0.15);
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #0f3460, #1a1a2e);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            margin-top: 8px;
        }
        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(15, 52, 96, 0.4);
        }
        .btn-login:active {
            transform: translateY(0);
        }
        .alert-msg {
            display: none;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-logo">
        <i class="fas fa-hands-asl-interpreting"></i>
        <h1>signCollect</h1>
        <p>Log in om verder te gaan</p>
    </div>

    <div class="alert alert-danger alert-msg" id="errorMsg"></div>

    <form id="login-form">
        <div class="form-floating">
            <input type="text" class="form-control" id="username" name="username" placeholder="Gebruikersnaam" required autofocus>
            <label for="username"><i class="fas fa-user me-2"></i>Gebruikersnaam</label>
        </div>
        <div class="form-floating">
            <input type="password" class="form-control" id="password" name="password" placeholder="Wachtwoord" required>
            <label for="password"><i class="fas fa-lock me-2"></i>Wachtwoord</label>
        </div>
        <button type="submit" class="btn-login" id="loginBtn">
            <span id="loginText">Inloggen</span>
            <span id="loginSpinner" style="display:none"><i class="fas fa-spinner fa-spin"></i> Laden...</span>
        </button>
    </form>
</div>

<script>
    $(document).ready(function () {
        checkSession();
    });

    function getRedirectUrl() {
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get('redirect');
        // Honor ?redirect= only when it resolves to this origin, whether it
        // came as a full URL (userProtect.js) or a bare path (menu_beta's
        // api.js). A substring test for the host name dropped the bare paths
        // and let https://elsewhere/?x=<host> through. The legacy /menu.html
        // landing page is still skipped: users pick an interface from the hub.
        if (redirect) {
            try {
                var u = new URL(redirect, window.location.origin);
                if (u.origin === window.location.origin
                    && !/\/menu\.html$/.test(u.pathname)) {
                    return u.pathname + u.search + u.hash;
                }
            } catch (e) {}
        }
        return '/index.html';
    }

    // Expire sessionObject on this host, and with includeParents also on
    // every parent domain (test.example.nl -> example.nl). Computed from
    // location.hostname at run time rather than written into the file, so the
    // deploy's URL rewrite cannot collapse the variants into one.
    function clearSessionCookies(includeParents) {
        var expired = 'sessionObject=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/';
        var labels = window.location.hostname.split('.');
        document.cookie = expired;
        var last = includeParents ? labels.length - 2 : 0;
        for (var i = 0; i <= last; i++) {
            document.cookie = expired + '; domain=' + labels.slice(i).join('.');
        }
    }

    function checkSession() {
        // If the user just logged out, stay on the login form even if some
        // copy of the cookie is still lingering, and clear this host's copies
        // so the next page load is clean.
        var freshLogout = new URLSearchParams(window.location.search).get('fresh') === '1';
        if (freshLogout) {
            clearSessionCookies(false);
            return;
        }

        // Only skip the form when the server accepts the cookie. A cookie
        // that merely parses may be another host's: production's is set on
        // the parent domain and so also reaches a demo on a subdomain, where
        // every API refuses it.
        if (document.cookie.indexOf('sessionObject=') === -1) return;
        $.ajax({ url: '/session_check.php', cache: false })
            .done(function () { window.location.href = getRedirectUrl(); });
    }

    function showError(msg) {
        $('#errorMsg').text(msg).fadeIn(200);
    }

    $('#login-form').submit(function (event) {
        event.preventDefault();
        $('#errorMsg').hide();

        var username = $('#username').val();
        var password = $('#password').val();

        $('#loginText').hide();
        $('#loginSpinner').show();
        $('#loginBtn').prop('disabled', true);

        $.ajax({
            url: 'login_sc.php',
            method: 'POST',
            data: { username: username, password: password },
            success: function (response) {
                var data = JSON.parse(response);
                if (data.status === 'success') {
                    var role = data.role || 'user';
                    // expiresAt and sig come from the server: they are the
                    // signed payload. Recomputing expiresAt here would
                    // invalidate the signature. role is kept only for the UI -
                    // the server reads it from the database, never from here.
                    var expiresAt = data.expiresAt ||
                        new Date(Date.now() + 365*24*60*60*1000).toUTCString();
                    var sessionObject = {
                        userId: data.userId,
                        username: data.username,
                        role: role,
                        expiresAt: expiresAt,
                        sig: data.sig || ''
                    };
                    // A same-named cookie on a parent domain is older, so the
                    // browser sends it first, and PHP keeps only the first of
                    // two same-named cookies: it would hide the one set below.
                    // On a demo under production's domain this logs the browser
                    // out of production.
                    clearSessionCookies(true);
                    document.cookie = `sessionObject=${encodeURIComponent(JSON.stringify(sessionObject))}; expires=${expiresAt}; path=/; domain=@DOMAIN@`;
                    window.location.href = getRedirectUrl();
                } else if (data.status === 'blocked') {
                    showError('Uw account is geblokkeerd. Neem contact op met een beheerder.');
                    $('#loginText').show();
                    $('#loginSpinner').hide();
                    $('#loginBtn').prop('disabled', false);
                } else {
                    showError('Ongeldige gebruikersnaam of wachtwoord.');
                    $('#loginText').show();
                    $('#loginSpinner').hide();
                    $('#loginBtn').prop('disabled', false);
                }
            },
            error: function () {
                showError('Er is een fout opgetreden. Probeer het opnieuw.');
                $('#loginText').show();
                $('#loginSpinner').hide();
                $('#loginBtn').prop('disabled', false);
            }
        });
    });
</script>

</body>
</html>
