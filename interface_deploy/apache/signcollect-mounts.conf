# Tailscale issues a cert only for this node's own name, so the production
# subdomains become path mounts on a single origin. rewrite-urls.sh points the
# code here: api.signcollect.nl -> /api, media.signcollect.nl -> /media.
Alias /api   /web/zin/api
Alias /media /web/media_stub

<Directory /web/zin/api>
    Options +FollowSymLinks -Indexes
    AllowOverride All
    Require all granted
</Directory>
<Directory /web/media_stub>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>
