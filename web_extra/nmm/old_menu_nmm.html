        async function fetchData(page) {
    const offset = page * limit;
    const selectedThema = document.getElementById('thema-select').value; // Get selected thema
    let url = `https://leffe.science.uva.nl:8043/fetch_all.php?limit=${limit}&offset=${offset}&handle=allGlosses`;
    // let url = `https://leffe.science.uva.nl:8043/fetch_all.php?limit=${limit}&offset=${offset}&handle=searchGloss&gloss=1100-B`;

    // Append thema to URL if one is selected
    if (selectedThema) {
        //change handle from allglosses to themaFilter
        url = `https://leffe.science.uva.nl:8043/fetch_all.php?limit=${limit}&offset=${offset}&handle=themaFilter&thema=${encodeURIComponent(selectedThema)}`;
        // console.log(url);
    }

    try {
        const response = await fetch(url);
        const data = await response.json();
        renderTable(data);
        renderPagination(page, data.length);

        fetchCounts(); // Fetch counts and update header
    } catch (error) {
        console.error("Error fetching data:", error);
    }
}

        async function fetchNmmData(id, type) {
            try {
                const response = await fetch(`https://leffe.science.uva.nl:8043/nmm/fetch_nmm.php?id=${id}&type=${type}`);
                const data = await response.json();
                return data;

                return null;
            }
        }
        function renderPagination(currentPage, totalItems) {
    const pagination = $('#pagination');
    pagination.empty();
    const totalPages = Math.ceil(totalItems / limit);

    // Create Previous button
    pagination.append(`<li class="page-item ${currentPage === 0 ? 'disabled' : ''}">
        <a class="page-link" href="#" onclick="fetchData(${currentPage - 1})">Previous</a>
    </li>`);

    // Create Next button
    pagination.append(`<li class="page-item>
        <a class="page-link" href="#" onclick="fetchData(${currentPage + 1})">Next</a>
    </li>`);
}

async function getMatchedTranscriptions(id) {
    try {
        const response = await fetch(`https://leffe.science.uva.nl:8043/nmm/fetch_nmm_mt.php?id=${id}`, {
            method: 'GET',
        });

        // Check if the response is okay
        if (!response.ok) {
            throw new Error(`Error fetching data: ${response.statusText}`);
        }

        // Parse the response as JSON
        const data = await response.json();

        // Return the desired value from the response
        // console.log(data);
        return data['m_file'];
    } catch (error) {
        console.error("Error fetching matched transcriptions:", error);
        return null; // Return null or handle the error as needed
    }
}

function markAsReady(id, glos, thema, zelfopname) {
    // zelfopname = JSON.parse(zelfopname)
    const row = $(`tr[data-id="${id}"]`);
    //determine if the row has color lightgreen
    // const isReady = row.css('background-color') === 'rgb(40, 111, 17)';
    const isReady = row.hasClass('ready');
    console.log(isReady);

    // Determine the new state and action based on the current state
    const newType = isReady ? 'not_ready' : 'ready';
    const action = isReady ? 'remove' : 'insert';

    fetch('nmm/update_nmm.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ signbank_id: id, type: newType, action: action, glos: glos, thema: thema, zelfopname: zelfopname })
    })
        .then(response => response.json())
        .then(result => {
            console.log(result)
            if (result.success) {
                // Toggle the ready state and update row color
                if (isReady) {
                    row.removeClass('ready');
                    row.css('background-color', ''); // Reset to no color
                    // Enable opname and delete buttons if row is not ready
                    row.find('.opname-btn, .delete-btn').prop('disabled', false);
                } else {
                    row.addClass('ready');
                    row.css('background-color', 'lightgreen'); // Mark the row as green
                    // Disable opname and delete buttons if row is ready
                    row.find('.opname-btn, .delete-btn').prop('disabled', true);
                }
            } else {
                alert('Failed to update ready state: ' + result.error);
            }
        })
        .catch(error => {
            console.error('Error updating ready state:', error);
        });
}



        function deleteVideo(id, type) {
    fetch('nmm/update_nmm.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ signbank_id: id, type: type, action: 'delete' })
    })
        .then(response => response.json())
        .then(result => {
            if (result.success) {
                // Remove the video element from the row without refreshing the page
                const row = $(`tr[data-id="${id}"]`);
                row.find(`.${type}-actions video`).remove();

                // Re-check video presence after deletion
                const hasGC = row.find('.gc-actions video').length > 0;
                const hasOC = row.find('.oc-actions video').length > 0;
                const hasNMM = row.find('.nmm-actions video').length > 0;

                // Update row color based on remaining videos
                if (!hasGC || !hasOC || !hasNMM) {
                    row.css('background-color', '');
                }
            } else {
                alert('Failed to delete video: ' + result.error);
            }
        })
        .catch(error => {
            console.error('Error deleting video:', error);
        });
}

function updateVideoInRow(id, type, videoFileName, thumbnailFileName, autoplay = false) {
    const row = $(`tr[data-id="${id}"]`);
    if (row.length > 0) {
        const videoUrl = `https://leffe.science.uva.nl:8043/uploads/${videoFileName}`;
        const placeholderUrl = `https://leffe.science.uva.nl:8043/uploads/${thumbnailFileName}`;
        const actionCell = row.find(`.${type}-actions`);

        // Remove the old video and replace it with the new one with autoplay if specified
        actionCell.find('video').remove();
        const videoElement = $(`<video class="video-preview" src="${videoUrl}" type="video/webm" controls preload="none" poster="${placeholderUrl}"></video>`);
        
        if (autoplay) {
            videoElement.attr('autoplay', 'autoplay'); // Add autoplay attribute to the new video element
            videoElement[0].play(); // Ensure the video starts playing immediately
        }

        actionCell.append(videoElement);

        // Re-check video presence after update
        let hasGC = row.find('.gc-actions video').length > 0;
        let hasOC = row.find('.oc-actions video').length > 0;
        let hasNMM = row.find('.nmm-actions video').length > 0;

        // Mark the row as green if all videos are present
        if (hasGC && hasOC && hasNMM) {
            row.css('background-color', 'lightgreen');
        }
    }
}



        function showWebcamModal(id, type, glos, thema) {
    $('#webcamModal').modal('show');
    const videoElement = document.getElementById('webcamVideo');
    let stream;

    navigator.mediaDevices.getUserMedia({ video: true })
        .then(mediaStream => {
            stream = mediaStream;
            videoElement.srcObject = stream;

            $('#webcamModal').on('hidden.bs.modal', () => {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                    stream = null;
                }
            });

            // Create countdown overlay
            const countdownOverlay = document.createElement('div');
            countdownOverlay.style.position = 'fixed';
            countdownOverlay.style.top = '0';
            countdownOverlay.style.left = '0';
            countdownOverlay.style.width = '100%';
            countdownOverlay.style.height = '100%';
            countdownOverlay.style.display = 'flex';
            countdownOverlay.style.alignItems = 'center';
            countdownOverlay.style.justifyContent = 'center';
            countdownOverlay.style.fontSize = '100px';
            countdownOverlay.style.color = 'white';
            countdownOverlay.style.backgroundColor = 'rgba(0, 0, 0, 0.5)';
            countdownOverlay.style.zIndex = '1050'; // Higher than modal
            countdownOverlay.innerText = '3';
            document.body.appendChild(countdownOverlay);

            let countdown = 3;

            const countdownInterval = setInterval(() => {
                countdown--;
                countdownOverlay.innerText = countdown;

                if (countdown === 0) {
                    clearInterval(countdownInterval);
                    countdownOverlay.remove();

                    // Show red overlay on modal to indicate recording
                    $('#webcamModal .modal-body').addClass('modal-red');

                    try {
                        const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                        const chunks = [];

                        recorder.ondataavailable = event => {
                            if (event.data.size > 0) {
                                chunks.push(event.data);
                            }
                        };

                        recorder.onstart = () => {
                            // Indicate recording is active
                            $('#webcamModal .modal-body').addClass('modal-red');
                        };

                        recorder.onstop = () => {
                            $('#webcamModal .modal-body').removeClass('modal-red');
                            $('#webcamModal').modal('hide');
                            stream.getTracks().forEach(track => track.stop());
                            stream = null;

                            // Call uploadVideo to handle the upload process
                            uploadVideo(id, type, new Blob(chunks, { type: 'video/webm' }), glos, thema);
                        };

                        // Start recording immediately after countdown ends
                        recorder.start();

                        // Stop recording after 3 seconds
                        setTimeout(() => recorder.stop(), 3000);
                    } catch (error) {
                        console.error('Failed to start MediaRecorder:', error);
                        alert('Failed to start MediaRecorder. Ensure your browser supports video recording.');
                    }
                }
            }, 1000); // Countdown interval set to 1 second
        })
        .catch(error => {
            console.error('Error accessing webcam:', error);
            alert('Unable to access the webcam. Please check your camera settings.');
        });
}

async function fetchThemas() {
    try {
        const response = await fetch('https://leffe.science.uva.nl:8043/uniqueThema.php');
        const themas = await response.json();

        const themaSelect = document.getElementById('thema-select');
        themas.forEach(thema => {
            const option = document.createElement('option');
            option.value = thema;
            option.textContent = thema;
            themaSelect.appendChild(option);
        });
    } catch (error) {
        console.error('Error fetching themas:', error);
    }
}



function uploadVideo(id, type, blob, glos, thema) {
    const formData = new FormData();
    formData.append('video', blob, `video_${type}.webm`);
    formData.append('id', id);
    formData.append('type', type);
    formData.append('glos', glos);
    formData.append('thema', thema);

    fetch('nmm/upload_video_nmm.php', {
        method: 'POST',
        body: formData
    })
        .then(response => response.json())
        .then(result => {
            fetchCounts(); // Update counts after successful upload
            if (result.success) {
                // Update the video in the row with autoplay enabled
                updateVideoInRow(id, type, result.video, result.thumbnail, true);
            } else {
                alert(`Failed to upload video: ${result.error}`);
            }
        })
        .catch(error => {
            console.error('Error uploading video:', error);
            alert('Error uploading video.');
        });
}
